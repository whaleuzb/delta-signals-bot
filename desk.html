<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Controller</title><link rel="icon" href="/desktop/icon.png">
<style>
/* 455: Trade Controller — kompyuter ilovasi qobig'i (TradingView Desktop uslubida): yuqorida tablar,
   «Yangi tab» — bosh sahifa (grafik maketlari + bo'limlar plitkalari), skrinner, issiqlik xaritasi, iqtisodiy taqvim.
   Grafik va ilova bo'limlari — tab ichida /app?desk=1&emb=1 (iframe, har tab o'z holatida qoladi). */
:root{--bg:#000;--bg2:#0b0b0c;--bg3:#131314;--ln:rgba(255,255,255,.09);--ln2:rgba(255,255,255,.16);--tx:#e8ecdf;--mu:rgba(232,236,223,.55);--g:#c2f23a;--up:#22c55e;--dn:#ef4444}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}a{color:inherit}
#bar{height:38px;display:flex;align-items:stretch;background:#0e0e0f;border-bottom:1px solid var(--ln);user-select:none}
.bb{width:42px;flex:none;display:grid;place-items:center;cursor:pointer;color:var(--mu)}.bb:hover{color:var(--tx);background:rgba(255,255,255,.05)}
.bb img{width:22px;height:22px;border-radius:6px}
#tabs{display:flex;min-width:0;overflow-x:auto;scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}
.tb{display:flex;align-items:center;gap:7px;min-width:120px;max-width:230px;padding:0 8px 0 12px;border-right:1px solid var(--ln);cursor:pointer;color:var(--mu);white-space:nowrap;position:relative;font-size:12px}
.tb:hover{background:rgba(255,255,255,.04);color:var(--tx)}.tb.on{background:var(--bg);color:var(--tx)}.tb.on::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--g)}
.tb .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600}.tb .tp{font-variant-numeric:tabular-nums;font-weight:600}.tb .tx{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;opacity:.55;flex:none}.tb .tx:hover{opacity:1;background:rgba(255,255,255,.1)}
.tb .ti{width:16px;height:16px;flex:none;display:grid;place-items:center}.tb .ti img,.tb .ti span{width:16px;height:16px;border-radius:50%}
#plus{width:36px;flex:none;display:grid;place-items:center;cursor:pointer;color:var(--mu);font-size:18px}#plus:hover{color:var(--tx)}
#bar .sp{flex:1}
#me .avi,#avbig .avi{border-radius:50%;object-fit:cover;display:block}.avl{border-radius:50%;background:#1f2a12;color:var(--g);display:grid;place-items:center;font-weight:800}.avw{position:relative;cursor:pointer;flex:none}.avw em{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#c2f23a;color:#0b0b0c;font-style:normal;font-size:11px;display:grid;place-items:center;border:2px solid #0b0b0c}
#me{display:flex;align-items:center;gap:8px;padding:0 12px;cursor:pointer;color:var(--mu)}#me:hover{color:var(--tx)}#me i{width:24px;height:24px;border-radius:50%;background:#1f2a12;color:var(--g);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px}
#main{position:absolute;top:38px;left:0;right:0;bottom:0}
.pane{position:absolute;inset:0;display:none;overflow:auto}.pane.on{display:block}
.pane iframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
/* bosh sahifa */
.hm{max-width:1100px;margin:0 auto;padding:28px 24px 40px}
.hmh{display:flex;align-items:center;gap:14px;margin-bottom:18px}.hmh h1{font-size:22px;margin:0;letter-spacing:-.01em}.hmh .sp{flex:1}
.srch{position:relative;width:300px}.srch input{width:100%;height:34px;border-radius:17px;border:1px solid var(--ln2);background:#151516;padding:0 14px 0 34px;outline:none}.srch input:focus{border-color:rgba(194,242,58,.6)}.srch svg{position:absolute;left:12px;top:10px;opacity:.6}
.srr{position:absolute;top:38px;left:0;right:0;z-index:20;background:#161617;border:1px solid var(--ln2);border-radius:10px;max-height:340px;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.srr div{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer}.srr div:hover,.srr div.on{background:rgba(255,255,255,.07)}.srr b{flex:1}
.lays{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:34px}
.lay{width:258px;height:84px;border-radius:10px;border:1px solid var(--ln2);padding:12px 14px;cursor:pointer;position:relative;background:#0b0b0c}.lay:hover{border-color:rgba(255,255,255,.35)}
.lay.new{border-style:dashed;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700}
.lay b{display:flex;align-items:center;gap:8px;font-size:14px}.lay .m{color:var(--mu);font-size:11px;margin-top:6px}.lay .x{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--mu);opacity:0}.lay:hover .x{opacity:1}.lay .x:hover{background:rgba(255,255,255,.1);color:var(--tx)}
.band{height:56px;margin:0 -2000px 36px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,0)),radial-gradient(ellipse 60% 120% at 20% 0%,rgba(46,211,183,.28),transparent 70%),radial-gradient(ellipse 60% 120% at 80% 0%,rgba(194,242,58,.25),transparent 70%);border-top:1px solid rgba(194,242,58,.25)}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.tile{border-radius:10px;border:1px solid var(--ln2);overflow:hidden;cursor:pointer;background:#0b0b0c;transition:border-color .15s,transform .15s}.tile:hover{border-color:rgba(255,255,255,.35);transform:translateY(-1px)}
.tile .art{height:122px;position:relative;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#1c1c1e,#0d0d0e 70%);overflow:hidden}
.tile .art .bgx{position:absolute;inset:0;opacity:.35}
.tile .art .ic{width:68px;height:68px;border-radius:16px;background:#2a2a2c;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);position:relative;color:#f2f2f2}
.tile .nm{padding:11px 12px;font-weight:600;font-size:12.5px;border-top:1px solid var(--ln)}.tile .nm span{color:var(--mu);font-weight:500}
/* jadval sahifalari */
.pg{padding:18px 22px 30px;min-height:100%}
.pgh{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.pgh h2{margin:0 12px 0 0;font-size:20px}
.chip{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--ln2);background:transparent;cursor:pointer;color:var(--mu);font-weight:600;font-size:12px}.chip:hover{color:var(--tx)}.chip.on{background:var(--tx);color:#000;border-color:var(--tx)}
.inp{height:30px;border-radius:15px;border:1px solid var(--ln2);background:#151516;padding:0 12px;outline:none;width:200px}.inp:focus{border-color:rgba(194,242,58,.6)}
.upd{margin-left:auto;color:var(--mu);font-size:11px}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t th{position:sticky;top:0;background:var(--bg);text-align:right;font-weight:600;color:var(--mu);font-size:11px;padding:8px 10px;border-bottom:1px solid var(--ln2);cursor:pointer;white-space:nowrap;user-select:none}.t th:first-child,.t th:nth-child(2){text-align:left}.t th.s{color:var(--tx)}
.t td{padding:7px 10px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}.t td:first-child{color:var(--mu);text-align:left;width:44px}.t td:nth-child(2){text-align:left}
.t tr:hover td{background:rgba(255,255,255,.035)}.t tbody tr{cursor:pointer}
.sym{display:flex;align-items:center;gap:9px;font-weight:700}.sym img,.sym .lt{width:20px;height:20px;border-radius:50%;flex:none}.lt{display:inline-grid;place-items:center;background:rgba(255,255,255,.1);font-size:10px;font-weight:800}
.u{color:var(--up)}.d{color:var(--dn)}
.rgb{display:inline-block;width:90px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);position:relative;vertical-align:middle}.rgb i{position:absolute;top:-3px;width:2px;height:10px;background:var(--tx);border-radius:1px}
.more{display:block;margin:14px auto;height:34px;padding:0 18px}
/* issiqlik xaritasi */
#hmap{position:relative;height:calc(100vh - 38px - 76px);min-height:420px}
.hc{position:absolute;overflow:hidden;border:1px solid #000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:#fff;transition:filter .1s}.hc:hover{filter:brightness(1.2);z-index:2;outline:1px solid #fff}
.hc b{font-weight:800;line-height:1.1}.hc span{opacity:.9;font-weight:600;font-variant-numeric:tabular-nums}
/* taqvim */
.cday{margin:18px 0 6px;font-weight:800;font-size:13px;color:var(--tx)}.cday.td{color:var(--g)}
.imp{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}.imp.h{background:#ef4444}.imp.m{background:#f59e0b}
.t.cal{table-layout:fixed}.t.cal td:nth-child(2){white-space:normal}.t.cal th:nth-child(2){text-align:left}.t.cal tr.nx td{background:rgba(194,242,58,.07)}.t.cal tr.ps td{opacity:.6}
.cal .orig{color:var(--mu);font-size:11px;margin-top:2px}
/* menyu */
.amn{width:330px;padding:8px}.amn .ami span{white-space:nowrap}.amn .amh{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px;cursor:default}.amn .amh:hover{background:none}.amn .amh b{font-size:14px}.amn .amh small{color:var(--mu);font-size:12px;margin-top:-4px}
.amn .ami{display:flex;align-items:center;gap:12px;padding:8px 10px}.amn .ami span{flex:1}.amn .ami i{font-style:normal;font-size:11.5px;color:var(--mu)}.amn .ami.dis{opacity:.4;cursor:default}.amn .ami.dis:hover{background:none}.amn svg{flex:none;color:var(--tx)}
.amn .amz{display:flex;align-items:center;gap:12px;padding:6px 10px;cursor:default}.amn .amz:hover,.amn .aml:hover{background:none}.amn .amz span{flex:1}.amn .amz b{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.08);cursor:pointer;padding:0;font-size:16px}.amn .amz b:hover{background:rgba(255,255,255,.16)}.amn .amz em{font-style:normal;width:44px;text-align:center;cursor:pointer;font-weight:600}
.amn .aml{display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:default;flex-wrap:wrap}.amn .aml span{flex:1 0 100%;color:var(--mu);font-size:11.5px}.amn .aml b{flex:1;text-align:center;padding:6px 4px;border-radius:7px;background:rgba(255,255,255,.06);cursor:pointer;font-weight:600;font-size:12.5px}.amn .aml b.on{background:#e8ecdf;color:#0b0b0c}
.mn{position:fixed;z-index:100;min-width:220px;background:#18181a;border:1px solid var(--ln2);border-radius:10px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.6)}
.mn div{padding:8px 12px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:10px}.mn div:hover{background:rgba(255,255,255,.07)}.mn hr{border:0;border-top:1px solid var(--ln);margin:6px 0}.mn .mh{color:var(--mu);font-size:11px;cursor:default;padding:6px 12px}.mn .mh:hover{background:none}.mn .ck{margin-left:auto;color:var(--g)}
.empty{color:var(--mu);text-align:center;padding:60px 0}
/* 457: o'ng watchlist + ikonka qatori (grafik bo'lmagan tablarda) */
#side{position:absolute;top:38px;right:44px;bottom:0;width:330px;border-left:1px solid var(--ln);background:#0b0b0c;display:none;flex-direction:column}
body.sbon #side{display:flex}#rail{position:absolute;top:38px;right:0;bottom:0;width:44px;border-left:1px solid var(--ln);background:#0e0e0f;display:none;flex-direction:column;align-items:center;padding-top:8px;gap:4px}body.sbrail #rail{display:flex}
#rail span{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--mu);cursor:pointer}#rail span:hover{background:rgba(255,255,255,.07);color:var(--tx)}
body.sbrail #main{right:44px}body.sbon #main{right:374px}
.sbh{display:flex;align-items:center;padding:10px 12px;font-size:13px}.sbh b{cursor:pointer}.sbh b::first-letter{color:#ef4444}.sbi{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--mu);font-size:16px}.sbi:hover{background:rgba(255,255,255,.08);color:var(--tx)}
.sbc,.sbr{display:grid;grid-template-columns:1fr 78px 64px 58px 14px;gap:4px;align-items:center;padding:0 10px;font-variant-numeric:tabular-nums}.sbc{color:var(--mu);font-size:11px;height:24px;border-bottom:1px solid var(--ln)}.sbc span:not(:first-child){text-align:right}
.sbl{overflow:auto;flex:1}.sbr{height:30px;font-size:12px;cursor:pointer;grid-template-columns:16px 1fr 78px 64px 58px 14px}.sbr:hover{background:rgba(255,255,255,.04)}.sbr>span:not(.sbs){text-align:right}.sbs{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sbx{opacity:0;color:var(--mu)}.sbr:hover .sbx{opacity:1}
.sbc{grid-template-columns:1fr 78px 64px 58px 14px}
/* 457: kripto bozori sahifasi */
.mk{max-width:1440px;margin:0 auto;padding:10px 28px 40px}.mkh{text-align:center;margin:6px 0 22px;cursor:pointer}.mks{font-weight:700;font-size:18px}.mkt{font-weight:800;font-size:44px;letter-spacing:-.02em;line-height:1.1}.mkt span{font-size:26px;vertical-align:middle}
.lists{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}.lists .chip{height:32px;font-size:12.5px}
.mkh2{font-size:22px;margin:0 0 8px}.mkp{color:rgba(232,236,223,.8);max-width:820px;line-height:1.55;margin:0 0 22px}
.mtabs{display:flex;align-items:center;gap:4px;margin-bottom:8px}.mtabs>span[data-tab]{padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mu)}.mtabs>span[data-tab].on{background:#232325;color:var(--tx)}.mtabs .inp{margin-right:10px}
.mkt2 td{padding:9px 10px}.mkt2 small{color:var(--mu);font-size:9px}.tk{background:#232325;border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700;min-width:44px;text-align:center}.cn{font-weight:500;color:var(--tx);max-width:180px;overflow:hidden;text-overflow:ellipsis}.nx{color:var(--mu)}
.mkt2 .cats{text-align:left;color:var(--mu);max-width:200px;overflow:hidden;text-overflow:ellipsis}
/* 457: taqvim */
.cal2{max-width:1500px}.calbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}.calbar .rng{font-size:17px;margin-left:10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px}.dcard{border:1px solid var(--ln2);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:92px;background:#0b0b0c}.dcard:hover{border-color:rgba(255,255,255,.3)}.dcard.on{background:#1c1c1e;border-color:rgba(255,255,255,.4)}.dcard.td .dn{color:var(--g)}
.dn{font-weight:700;margin-bottom:6px}.dr{display:flex;justify-content:space-between;color:var(--mu);font-size:11px;line-height:1.6}.dr b{color:var(--tx);font-weight:600}
.calf{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}.calf .chip{height:28px;display:inline-flex;align-items:center;gap:5px}
.calt{table-layout:fixed}.calt tr.dh td{background:#151516;font-weight:700;color:var(--tx);text-align:left;padding:9px 14px}.calt td.tm{text-align:left;color:var(--tx)}.calt tr.nx td{background:rgba(194,242,58,.07)}.calt tr.ps td{color:rgba(232,236,223,.6)}.calt tbody tr{cursor:default}
.ibars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}.ibars i{width:3px;background:rgba(255,255,255,.15);border-radius:1px}.ibars i:nth-child(1){height:5px}.ibars i:nth-child(2){height:8px}.ibars i:nth-child(3){height:12px}
.ibars.l1 i:nth-child(1){background:#3b82f6}.ibars.l2 i:nth-child(-n+2){background:#f59e0b}.ibars.l3 i{background:#ef4444}
.orig{color:var(--mu);font-size:11px;margin-left:6px}
/* 456: native bo'limlar */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{border:1px solid var(--ln2);border-radius:12px;padding:14px 16px;background:linear-gradient(160deg,#121213,#0a0a0b)}.kpi .k{color:var(--mu);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}.kpi .v{font-size:22px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}.kpi .s{color:var(--mu);font-size:12px;margin-top:3px}
.btn{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--ln2);background:#18181a;cursor:pointer;font-weight:600;font-size:12px;white-space:nowrap}.btn:hover{background:#222224}.btn.p{background:var(--g);color:#000;border-color:var(--g)}.btn.p:hover{filter:brightness(1.08)}.btn.d{color:#ff6b6b}.btn:disabled{opacity:.4;cursor:default}
.btn.sm{height:24px;padding:0 8px;font-size:11px;border-radius:6px}
.sel{height:30px;border-radius:8px;border:1px solid var(--ln2);background:#151516;padding:0 10px;outline:none;color:var(--tx)}
.side{font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px}.side.L{background:rgba(34,197,94,.15);color:var(--up)}.side.S{background:rgba(239,68,68,.15);color:var(--dn)}
.st{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.08);color:var(--mu)}.st.A{background:rgba(194,242,58,.12);color:var(--g)}
.acts{display:flex;gap:4px;justify-content:flex-end}
.tps i{display:inline-block;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);margin-right:3px}.tps i.on{background:var(--g)}
.sect{margin:22px 0 10px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:10px}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{border:1px solid var(--ln2);border-radius:12px;padding:14px 16px;background:#0b0b0c}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
/* modal */
#mdl{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:grid;place-items:center}
#mdl .mb{width:min(480px,94vw);max-height:90vh;overflow:auto;background:#141415;border:1px solid var(--ln2);border-radius:14px;padding:20px 22px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
#mdl h3{margin:0 0 4px;font-size:17px}#mdl .sub{color:var(--mu);font-size:12px;margin-bottom:14px}
#mdl label{display:block;color:var(--mu);font-size:11px;font-weight:600;margin:12px 0 5px}
#mdl input.f,#mdl select.f{width:100%;height:36px;border-radius:9px;border:1px solid var(--ln2);background:#0e0e0f;padding:0 12px;outline:none;color:var(--tx)}#mdl input.f:focus{border-color:rgba(194,242,58,.6)}
#mdl .row{display:flex;gap:8px;flex-wrap:wrap}#mdl .row .chip{height:30px}
#mdl .ft{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#mdl .pv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln)}#mdl .pv span{color:var(--mu)}
#tst{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;background:#1c1c1e;border:1px solid var(--ln2);border-radius:10px;padding:10px 16px;max-width:560px;box-shadow:0 12px 30px rgba(0,0,0,.6);display:none}
.exs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}.exn{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.exn span{display:block;color:var(--mu);font-size:11px}.exn b{font-variant-numeric:tabular-nums}
.av{border-radius:50%;border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;box-sizing:border-box}.av img{display:block}
.hist div{padding:8px 0;border-bottom:1px solid var(--ln)}.hist b{color:var(--mu);font-weight:500;font-size:11px;display:block}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,#141415,#1d1d1f,#141415);background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
