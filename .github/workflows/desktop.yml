# 452: Trade Controller kompyuter ilovasi — Windows (.exe), macOS (.dmg, Intel + Apple Silicon), Linux (.AppImage, .deb).
# desktop/ o'zgarganda yoki qo'lda (Actions → Desktop → Run workflow) yig'iladi va GitHub Release'ga
# (teg desktop-v<versiya>) yuklanadi. Yangi reliz uchun desktop/src-tauri/tauri.conf.json'dagi versiyani oshiring.
name: Desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux kutubxonalari
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: npm
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: "Trade Controller v__VERSION__"
          releaseBody: |
            Trade Controller — kompyuter uchun ilova.
            Windows: *_x64-setup.exe · macOS: *.dmg · Linux: *.AppImage yoki *.deb
            Yuklab olish sahifasi: https://web-production-addc3.up.railway.app/desktop
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
