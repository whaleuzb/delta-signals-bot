# 452: Trade Controller kompyuter ilovasi — Windows (.exe) va macOS (.dmg, Intel + Apple Silicon). 481: Linux olib tashlandi.
# desktop/ o'zgarganda yoki qo'lda (Actions → Desktop → Run workflow) yig'iladi va GitHub Release'ga
# (teg desktop-v<versiya>) yuklanadi. Yangi reliz uchun desktop/src-tauri/tauri.conf.json'dagi versiyani oshiring.
name: Desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 480: reliz avval bitta joyda yaratiladi — uch platforma bir vaqtda yaratmoqchi bo'lib bir-birining fayllarini yo'qotmasin
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.r.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          T="desktop-v$V"
          if ! gh release view "$T" >/dev/null 2>&1; then
            gh release create "$T" --target "$GITHUB_SHA" --title "Trade Controller v$V" --notes "Trade Controller — kompyuter uchun ilova.
          Windows: *_x64-setup.exe · macOS: *.dmg
          Yuklab olish sahifasi: https://tradecontroller.app/desktop"
          fi
          echo "id=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/$T --jq .id)" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: npm
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}
