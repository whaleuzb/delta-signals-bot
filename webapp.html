<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark"><title>Trade Controller</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* 240: Mini App — kosmik fon + "shisha" (glassmorphism) kartalar.
   Faqat 3 rang: oq/kulrang (asos), yashil (urg'u/foyda), qizil (zarar/yopish). */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#f5f5f7;--mut:rgba(200,205,194,.62);--faint:rgba(200,205,194,.36);
 /* 274/275: fon va asos — avvalgidek tungi; palitra ranglari urg'u sifatida:
    Acid Lime (urg'u), Cloud Grey (ikkinchi darajali matn/chiziqlar), Jet Black */
 --cloud:#b4b9ae;--jet:#0e100d;
 --g:#c2f23a;--r:#ff5c5c;--top:0px;
 --glass:linear-gradient(155deg,rgba(255,255,255,.06),rgba(255,255,255,.018) 60%,rgba(255,255,255,.01)),rgba(14,14,16,.30);
 --edge:rgba(255,255,255,.13);--ease:cubic-bezier(.22,1,.36,1)}
html{background:#050506}
html,body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Inter,Roboto,sans-serif;
 font-size:13px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:'ss01','cv11';overscroll-behavior:none}
body{background:transparent;padding:calc(var(--top) + 10px) 14px 20px;min-height:100vh;overflow-x:clip}
/* 292: iOS'da overflow-x:hidden body'ni ichki aylantiriladigan blokka aylantiradi — u yerda pastki
   padding e'tiborsiz qolardi va window scroll hodisasi kelmasdi; clip — blok yaratmaydi. Qo'shimcha: oxirida haqiqiy bo'sh joy. */
.endsp{height:calc(150px + max(env(safe-area-inset-bottom,0px),var(--bot,0px)))}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none}

/* ---- FON: yulduzlar (canvas) + tumanlik + donadorlik + chetdagi nur ---- */
#bg{position:fixed;inset:0;z-index:-3;width:100%;height:100%}
.neb{position:fixed;z-index:-2;border-radius:50%;filter:blur(60px);pointer-events:none;will-change:transform}
.neb.a{width:120vw;height:70vh;left:-50vw;top:-18vh;background:radial-gradient(closest-side,rgba(210,214,222,.22),transparent)}
.neb.b{width:90vw;height:60vh;right:-45vw;top:38vh;background:radial-gradient(closest-side,rgba(194,242,58,.14),transparent)}
.neb.c{width:80vw;height:50vh;left:-20vw;bottom:-25vh;background:radial-gradient(closest-side,rgba(200,200,210,.16),transparent)}
@keyframes n1{to{transform:translate3d(12vw,6vh,0) scale(1.15)}}
@keyframes n2{to{transform:translate3d(-14vw,-8vh,0) scale(1.1)}}
.grain{position:fixed;inset:-50%;z-index:-1;pointer-events:none;opacity:.10;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.streak{position:fixed;z-index:-1;pointer-events:none;width:2px;height:90px;border-radius:2px;opacity:.35;
 background:linear-gradient(to bottom,transparent,rgba(255,255,255,.7),transparent)}
.streak.s1{left:8px;top:22vh;transform:rotate(-32deg)}.streak.s2{right:10px;top:12vh;transform:rotate(30deg);height:60px}
.streak.s3{left:14px;bottom:24vh;transform:rotate(-24deg);height:50px;opacity:.2}

/* ---- SHISHA ---- */
.glass{position:relative;background:var(--glass);border:.5px solid rgba(255,255,255,.13);
 /* 276: Apple uslubi — tiniq chetlar: yuqorida yorqin "specular" chiziq, ichki ingichka hoshiya, pastda soya */
 box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 .5px rgba(255,255,255,.04),inset 0 -1px 0 rgba(0,0,0,.35),
  inset 1px 0 0 rgba(255,255,255,.05),0 1px 1px rgba(0,0,0,.4),0 14px 32px rgba(0,0,0,.42)}
/* 277: "muzli shisha" (frosted) — orqadagi fonni kuchli xiralashtiradi, sutsimon och tus,
   chetlarda nur sinishi (chap — iliq, o'ng — sovuq). Faqat asosiy kartalarda; uzun ro'yxat
   qatorlarida (.row/.trow) yo'q — 257 (telefon qizishi). */
.slide.glass,.card.glass,.pod.glass,.tile2.glass,.eq.glass,.sig.glass,.empty.glass,.mtile.glass{
 -webkit-backdrop-filter:blur(20px) saturate(1.15);backdrop-filter:blur(20px) saturate(1.15);
 background-color:rgba(255,255,255,.012);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 1.5px 0 0 rgba(255,190,150,.06),inset -1.5px 0 0 rgba(150,200,255,.06),
  inset 0 -1px 0 rgba(0,0,0,.32),inset 0 0 22px rgba(255,255,255,.012),0 1px 1px rgba(0,0,0,.4),0 16px 36px rgba(0,0,0,.45)}
/* 257: backdrop-filter faqat suzuvchi elementlarda — telefon qizimasin */
.nav.glass,.toast.glass,.sheet.glass,.pill.glass{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.glass.acc{background:radial-gradient(120% 90% at 100% 100%,rgba(194,242,58,.26),transparent 60%),var(--glass)}
/* 274: shisha "sezgirligi" — bosilgan nuqtadan yorug'lik to'lqini, chetlar yorishadi
   (faqat bosilganda ishlaydi — doimiy animatsiya yo'q, 257) */
.glass{transition:transform .25s var(--ease),border-color .35s,box-shadow .35s}
.glass.tap{border-color:rgba(194,242,58,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px rgba(194,242,58,.12),0 14px 34px rgba(0,0,0,.4)}
.hist{margin-top:10px}.hrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.hdot{width:8px;height:8px;border-radius:50%;background:var(--g);margin-top:5px;flex:none;box-shadow:0 0 0 3px rgba(194,242,58,.15)}
.ttabs{display:flex;gap:18px;border-bottom:1px solid rgba(255,255,255,.08);margin:-2px 0 0}
.ttabs a{padding:4px 0 10px;font-weight:700;font-size:14px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.ttabs a.on{color:var(--ink);border-bottom-color:var(--ink)}
.mcb{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:14px}.mcb .btn{margin:0;padding:12px 6px;font-size:13.5px}
.ordrow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.ordrow>div{display:flex;align-items:center;gap:8px}.ordrow .rs{display:block}
.mcg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
.mcg .mci span{display:block;color:var(--mut);font-size:11px;margin-bottom:3px}
.mcg .mci b{font-size:13.5px;font-weight:700;overflow-wrap:anywhere}
.mcg .mci:nth-child(3n){text-align:right}.mcg .mci:nth-child(3n+2){text-align:center}
.tapw{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:3}
.tapfx{position:absolute;left:var(--mx);top:var(--my);width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;pointer-events:none;z-index:3;
 background:radial-gradient(closest-side,rgba(232,248,190,.55),rgba(194,242,58,.18) 60%,transparent);animation:tapfx .6s var(--ease) forwards}
@keyframes tapfx{from{transform:scale(1);opacity:1}to{transform:scale(var(--ts,22));opacity:0}}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:linear-gradient(115deg,rgba(255,255,255,.045),transparent 35%),linear-gradient(to bottom,rgba(255,255,255,.015),transparent 40%)}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{border-radius:999px;padding:8px 13px;font-weight:600;font-size:13px;color:var(--ink);display:flex;align-items:center;
 gap:7px;max-width:68%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-decoration:none;cursor:pointer}
.pill span{overflow:hidden;text-overflow:ellipsis}
.pill select{position:absolute;opacity:0;inset:0;width:100%}

/* ---- bosh slayder ---- */
.slider{margin:22px -14px 6px;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
 padding:0 14px;gap:10px;scroll-padding:0 14px}
.slider::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;cursor:pointer;border-radius:26px;padding:22px 20px 20px;min-height:178px;overflow:hidden}
.slide .k{font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.slide .v{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:10px;line-height:1.05}
.slide .d{color:var(--mut);margin-top:8px;font-size:12px}
.slide .art{position:absolute;right:16px;top:16px;color:var(--faint)}
.sch{position:absolute;left:0;right:0;bottom:0;height:52px;pointer-events:none;opacity:.95}
.sch svg,.cch svg{width:100%;height:100%;display:block;overflow:visible}
.slide:has(.sch){padding-bottom:62px}
.cch{height:40px;margin-top:12px;pointer-events:none}
.slide.acc .art{color:var(--g);opacity:.8}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 16px}
.dots i{width:6px;height:6px;border-radius:6px;background:rgba(255,255,255,.22);transition:all .35s var(--ease)}
.dots i.on{width:18px;background:var(--ink)}

.card{border-radius:22px;padding:16px;margin-bottom:10px;min-height:104px;cursor:pointer;overflow:hidden;
 transition:transform .25s var(--ease)}
.card:active,.btn:active,.pill:active,.slide:active{transform:scale(.97)}
.card h2{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.2;max-width:66%}
.card .s{color:var(--mut);font-size:12px;margin-top:5px;max-width:66%}
.card .tag{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);
 border-radius:999px;padding:5px 11px;font-weight:600;font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .card h2,.row2 .card .s{max-width:100%}
.deco{position:absolute;right:14px;bottom:12px;color:var(--faint);transition:transform .6s var(--ease)}
.acc .deco{color:var(--g);opacity:.75}
.deco svg.ic{stroke-width:1.3}
.card:hover .deco{transform:translate(-3px,-3px)}

/* ---- pastki panel ---- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));
 width:min(92vw,420px);border-radius:999px;display:flex;padding:5px;z-index:10}
/* 289: pastga aylantirganda menyu (va DIP tanga) yashirinadi, yuqoriga — qaytadi;
   iPhone'da oxirgi karta menyu ostida qolmasin */
.nav{transition:transform .35s var(--ease),opacity .3s}
.nav.hid{transform:translate(-50%,calc(100% + 60px));opacity:0;pointer-events:none}
.nav .ind{position:absolute;top:5px;bottom:5px;left:5px;border-radius:999px;background:rgba(255,255,255,.12);
 border:1px solid rgba(255,255,255,.08);transition:transform .45s var(--ease);z-index:0}
.nav a{position:relative;z-index:1;flex:1;text-align:center;padding:7px 0 5px;color:var(--mut);font-size:10px;
 text-decoration:none;cursor:pointer;transition:color .3s}
.nav a .i{display:block;line-height:1;margin-bottom:3px;transition:transform .35s var(--ease)}
.nav a.on{color:#fff}.nav a.on .i{color:var(--g);transform:translateY(-1px) scale(1.08)}
.nav .ind{transition:transform .45s var(--ease),width .45s var(--ease),opacity .25s}
.nav a.coinb{flex:0 0 64px;overflow:visible;font-weight:700}
.nav a.coinb .sp{display:block;height:23px}
.coinb .cz{position:absolute;left:50%;top:-38px;width:58px;height:58px;margin-left:-29px;perspective:240px}
/* tanga aynan o'rtada: chapda 3 ta (Bosh, Wallet, Signallar), o'ngda 3 ta tugma — hammasi teng kenglikda (321) */
.coinb .cf{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0a0c0d;
 background:radial-gradient(circle at 34% 28%,#fff 0,#e9ecee 18%,#a9afb4 52%,#5d6368 80%,#2f3337 100%);
 box-shadow:0 0 0 3px #08090a,0 0 0 4px rgba(255,255,255,.14),0 8px 20px rgba(0,0,0,.6),0 0 26px rgba(194,242,58,.32);
 animation:coinspin 8s cubic-bezier(.45,.05,.3,1) infinite;will-change:transform}
.coinb .cf::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(0,0,0,.18);
 background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 48%,transparent 60%)}
.nav a.coinb.on{color:#fff}
.nav a.coinb.on .cf{box-shadow:0 0 0 3px #08090a,0 0 0 5px var(--g),0 8px 20px rgba(0,0,0,.6),0 0 30px rgba(194,242,58,.55)}
.nav a.coinb:active .cz{transform:scale(.92)}
.coinb .cz{transition:transform .2s var(--ease)}
/* Yengil: 8 soniyada bir marta aylanadi (faqat transform — GPU), qolgan vaqt tinch */
@keyframes coinspin{0%,80%{transform:rotateY(0)}95%,100%{transform:rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){.coinb .cf{animation:none}}

.g{color:var(--g)}.r{color:var(--r)}.m{color:var(--mut)}
h3{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:18px 2px 12px;display:flex;justify-content:space-between;align-items:baseline}
h3 small{font-size:12px;color:var(--mut);font-weight:600}
.chips{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none}
.chip{border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}
.chip.on{color:#fff;border-color:rgba(194,242,58,.5)}

.sig{border-radius:22px;padding:14px;margin-bottom:10px;overflow:hidden;touch-action:pan-y}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sym{font-weight:700;font-size:15px;letter-spacing:-.01em}
.b{display:inline-block;font-size:10px;font-weight:700;border-radius:7px;padding:2px 6px;margin-left:5px;vertical-align:2px}
.bl{background:rgba(194,242,58,.16);color:var(--g)}.bs{background:rgba(255,92,92,.16);color:var(--r)}
.bx{background:rgba(255,255,255,.09);color:var(--ink)}
.pnl{font-weight:800;font-size:17px;text-align:right;letter-spacing:-.02em}
.pnl small{display:block;font-size:12px;font-weight:600}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.08);margin:12px 0 2px;overflow:hidden;position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;transition:all .8s var(--ease)}
.spk{height:70px;margin:10px -2px 2px;position:relative}
.spk svg{width:100%;height:100%;display:block;overflow:visible}
.spk .sk{height:100%;border-radius:12px;background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.08),rgba(255,255,255,.03));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.spk .ln{fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spk .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spk .ar{opacity:0;animation:fade .9s .4s forwards}@keyframes fade{to{opacity:1}}
.spk .lv{stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:3 4}
.spk .lb{position:absolute;left:0;font-size:9px;font-weight:700;padding:1px 5px;border-radius:5px;transform:translateY(-50%);
 background:rgba(10,10,12,.7);border:1px solid rgba(255,255,255,.08)}
.spk .pt{position:absolute;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%)}
.spk .pt{box-shadow:0 0 8px currentColor}
@keyframes ring{to{transform:scale(2.2);opacity:0}}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.kv div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:7px 9px;font-size:12px}
.kv b{display:block;font-size:10px;color:var(--mut);font-weight:500}
.tps{font-size:12px;color:var(--mut);margin-bottom:10px;word-break:break-word}
.tps b{color:var(--ink);font-weight:600;margin-right:6px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);margin:0 4px 1px 0}
.dot.on{background:var(--g);box-shadow:0 0 8px var(--g)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px 10px;font-weight:700;font-size:12px;color:var(--ink);
 background:rgba(255,255,255,.07);cursor:pointer;flex:1;min-width:52px;white-space:nowrap;transition:transform .2s var(--ease),opacity .2s}
.btn.p{background:rgba(194,242,58,.15);color:var(--g);border-color:rgba(194,242,58,.25)}
.btn.d{background:rgba(255,92,92,.13);color:var(--r);border-color:rgba(255,92,92,.22)}
.btn.full{flex-basis:100%}
.btn:disabled{opacity:.4}
.empty{text-align:center;color:var(--mut);padding:56px 18px;border-radius:22px;margin-top:8px}
.empty .ic{color:var(--faint);margin-bottom:10px}

/* ---- animatsiyalar ---- */
.anim .rise{opacity:0;animation:rise .7s var(--ease) forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.in-r{animation:inR .45s var(--ease)}.in-l{animation:inL .45s var(--ease)}
@keyframes inR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.logo{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;color:var(--g);margin-bottom:14px}
.logo svg{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);margin-right:6px;
 box-shadow:0 0 0 0 rgba(194,242,58,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(194,242,58,0)}100%{box-shadow:0 0 0 0 rgba(194,242,58,0)}}
.flash-g{animation:fg 1s}.flash-r{animation:fr 1s}
@keyframes fg{30%{color:#fff;text-shadow:0 0 12px var(--g)}}@keyframes fr{30%{color:#fff;text-shadow:0 0 12px var(--r)}}

/* ---- toast va pastdan chiqadigan oyna ---- */
.toast{position:fixed;left:14px;right:14px;bottom:88px;border-radius:16px;padding:11px 14px;font-size:13px;z-index:30;
 transform:translateY(140%);opacity:0;transition:all .45s var(--ease)}
.toast.show{transform:none;opacity:1}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .35s}
.shade.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:8px;right:8px;bottom:8px;z-index:41;border-radius:28px;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));
 transform:translateY(110%);transition:transform .5s var(--ease);background:linear-gradient(155deg,rgba(40,40,44,.92),rgba(20,20,22,.94))}
.sheet:not(.show){visibility:hidden;transition:transform .5s var(--ease),visibility 0s .5s}
.sheet.show{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);margin:0 auto 14px}
.sheet h4{font-size:16px;font-weight:700;margin-bottom:4px}
.sheet p{color:var(--mut);font-size:12px;margin-bottom:14px}
.sheet input{width:100%;display:block;font-size:22px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
 border-radius:14px;padding:12px 14px;outline:none;margin-bottom:12px}
.sheet input:focus{border-color:rgba(194,242,58,.55)}
.sheet .btn{padding:13px;font-size:14px;width:100%;margin-top:4px}
/* ---- 244: reyting, turnir, guruh sahifasi ---- */
.seg{display:flex;padding:4px;border-radius:14px;margin:0 0 12px;position:relative}
.seg a{flex:1;text-align:center;padding:8px 4px;font-size:12px;font-weight:700;color:var(--mut);border-radius:10px;cursor:pointer;position:relative;z-index:1;transition:color .3s}
.seg a.on{color:#fff}.seg .si{position:absolute;top:4px;bottom:4px;left:4px;border-radius:10px;background:rgba(255,255,255,.12);transition:transform .45s var(--ease)}
.row{display:flex;align-items:center;gap:11px;border-radius:18px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:transform .25s var(--ease)}
.row:active{transform:scale(.98)}

 document.addEventListener('touchstart',function(e){var tch=e.touches[0];x0=tch.clientX;y0=tch.clientY;tgt=e.target},{passive:true});
 document.addEventListener('touchend',function(e){if(x0==null)return;var tch=e.changedTouches[0];var dx=tch.clientX-x0,dy=tch.clientY-y0;x0=null;
  if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6)return;if(tgt&&tgt.closest&&(tgt.closest('.slider')||tgt.closest('.chips')||tgt.closest('.sheet')))return;
  var main=TABS;var k=main.indexOf(S.tab);if(k<0)return;var n=k+(dx<0?1:-1);if(n<0||n>=main.length)return;go(main[n])},{passive:true})})();

/* ---- pastdan chiqadigan oyna (yangi stop) ---- */
function sheetOpen(h){var s=document.getElementById('sheet');s.innerHTML='<div class="grab"></div>'+h;s.classList.add('show');document.getElementById('shade').classList.add('show')}
function sheetClose(){document.getElementById('sheet').classList.remove('show');document.getElementById('shade').classList.remove('show')}
(function(){var y0=null;var s=document.getElementById('sheet');
 s.addEventListener('touchstart',function(e){y0=e.touches[0].clientY},{passive:true});
 s.addEventListener('touchmove',function(e){if(y0==null)return;var d=e.touches[0].clientY-y0;if(d>0){s.style.transition='none';s.style.transform='translateY('+d+'px)'}},{passive:true});
 s.addEventListener('touchend',function(e){var d=e.changedTouches[0].clientY-(y0||0);s.style.transition='';s.style.transform='';y0=null;if(d>80)sheetClose()},{passive:true})})();
function askStop(id){var i=S.items.filter(function(x){return x.id==id})[0];
 sheetOpen('<h4>'+esc(t('newstop'))+'</h4><p>'+esc(i.symbol)+' · '+esc(t('entry'))+' '+fp(i.entry)+' · '+esc(t('price'))+' '+fp(i.price)+'</p>'
 +'<input id="stopIn" inputmode="decimal" value="'+(i.sl!=null?i.sl:'')+'"><button class="btn p full" onclick="saveStop('+id+')">'+esc(t('save'))+'</button>');
 setTimeout(function(){var e=document.getElementById('stopIn');if(e){e.focus();e.select()}},350)}
function saveStop(id){var p=parseFloat(String(document.getElementById('stopIn').value).replace(',','.'));if(!(p>0))return;sheetClose();act(id,'sl',p,true)}
/* ---- 248: qolgan boshqaruv amallari (pastdan chiqadigan oyna) ---- */
function itm(id){return S.items.filter(function(x){return x.id==id})[0]}
function num(v){v=parseFloat(String(v||'').replace(',','.'));return v>0?v:null}
function nums(v){return String(v||'').replace(/,/g,' ').split(/[\s;]+/).map(num).filter(function(x){return x})}
function inp(id,lbl,val,ph){return'<div class="rs" style="margin:2px 2px 6px">'+esc(lbl)+'</div><input id="'+id+'" inputmode="decimal" value="'+(val==null?'':esc(val))+'" placeholder="'+esc(ph||'')+'">'}
function sub(i){return esc(i.symbol)+' · '+esc(t('entry'))+' '+fp(i.entry)+' · '+esc(t('price'))+' '+fp(i.price)}
function askTps(id){var i=itm(id);sheetOpen('<h4>'+esc(t('tps_title'))+'</h4><p>'+sub(i)+'</p>'+inp('f1',t('tps_hint'),i.tps.join(' '))+'<button class="btn p full" onclick="var v=nums(document.getElementById(\'f1\').value);if(!v.length)return;sheetClose();act('+id+',\'tps\',null,true,v)">'+esc(t('save'))+'</button>')}
function askEntry(id){var i=itm(id);sheetOpen('<h4>'+esc(t('entry_title'))+'</h4><p>'+sub(i)+'</p>'+inp('f1',t('entry'),i.entry)+'<button class="btn p full" onclick="var v=num(document.getElementById(\'f1\').value);if(!v)return;sheetClose();act('+id+',\'entry\',v,true)">'+esc(t('save'))+'</button>')}
function askTpsl(id){var i=itm(id);sheetOpen('<h4>'+esc(t('tpsl_btn'))+'</h4><p>'+sub(i)+'</p>'+inp('f1',t('sl_l'),'')+inp('f2',t('tps_hint'),'')+'<button class="btn p full" onclick="var s=num(document.getElementById(\'f1\').value),v=nums(document.getElementById(\'f2\').value);if(!s||!v.length)return;sheetClose();act('+id+',\'tpsl\',null,true,{sl:s,tps:v})">'+esc(t('save'))+'</button>')}
/* 361: summa so'ralganda bo'sh summa (depozit − ochiq pozitsiyalarda band), botdagidek */
function wsBusy(wid,fut){var w=cur(),L=(w&&w.id==wid&&w.type!='cex')?S.items:(S.busyC||{})[wid];
 if(!L){S.busyC=S.busyC||{};if(!S.busyQ){S.busyQ=1;api('open',{ws:wid}).then(function(d){S.busyC[wid]=d.items||[];S.busyQ=0;if(S.page&&S.page.id=='ns'){nsKeep();nsRender()}}).catch(function(){S.busyQ=0})}return null}
 var b=0;L.forEach(function(i){if(i.alloc&&((i.lev>1)==!!fut))b+=i.alloc});return b}
function freeOf(w,fut){var dep=w?(fut?w.fut_deposit:w.deposit):null;if(dep==null)return null;var b=wsBusy(w.id,fut);return b==null?{dep:dep}:{dep:dep,busy:b,free:Math.max(0,dep-b)}}
function freeLine(w,fut){var f=freeOf(w,fut);if(!f)return'';
 return'<div class="rs" style="margin:-2px 2px 10px">'+esc(t('free_l'))+': <b style="color:var(--g)">'+(f.free!=null?f0(f.free):'…')+'</b> · '+esc(t('dep_l'))+' '+f0(f.dep)+(f.busy?' · '+esc(t('busy_l'))+' '+f0(f.busy):'')+'</div>'}
function askSize(id){var i=itm(id);sheetOpen('<h4>'+esc(t('size_title'))+'</h4><p>'+sub(i)+'</p>'+inp('f1',t('size_usd'),'')+freeLine(cur(),i.lev>1)+'<button class="btn p full" onclick="var v=num(document.getElementById(\'f1\').value);if(!v)return;sheetClose();act('+id+',\'size\',v,true)">'+esc(t('save'))+'</button>')}
var ADDM='now';
function askAdd(id,m){var i=itm(id);ADDM=m||ADDM;var usd=i.usd;
 sheetOpen('<h4>'+esc(t('add_title'))+'</h4><p>'+sub(i)+'</p>'
 +'<div class="seg glass" style="margin-bottom:12px"><div class="si" style="width:calc((100% - 8px)/2);transform:translateX('+(ADDM=='lim'?100:0)+'%)"></div><a class="'+(ADDM=='now'?'on':'')+'" onclick="askAdd('+id+',\'now\')">'+esc(t('now'))+'</a><a class="'+(ADDM=='lim'?'on':'')+'" onclick="askAdd('+id+',\'lim\')">'+esc(t('lim'))+'</a></div>'
 +(ADDM=='lim'?inp('f2',t('prices'),'',i.side=='LONG'?'< '+fp(i.price):'> '+fp(i.price)):'')
 +inp('f1',usd?t('size_usd'):t('size_x'),usd?Math.round(i.alloc||0):1)+(usd?freeLine(cur(),i.lev>1):'')
 +'<button class="btn p full" onclick="saveAdd('+id+')">'+esc(t('save'))+'</button>')}
function saveAdd(id){var v=num(document.getElementById('f1').value);if(!v)return;
 if(ADDM=='lim'){var p=nums(document.getElementById('f2').value);if(!p.length)return;sheetClose();act(id,'lim',v,true,p)}else{sheetClose();act(id,'add',v,true)}}
function confirmBox(m,cb){if(tg&&tg.showConfirm){try{tg.showConfirm(m,function(ok){if(ok)cb()});return}catch(e){}}if(confirm(m))cb()}
function act(id,a,arg,skip,args){var i=S.items.filter(function(x){return x.id==id})[0];
 var m=a=='close'?(i.status=='PENDING'?t('confirm_cancel'):t('confirm_close')):a=='pc'?t('confirm_pc',{p:arg}):null;
 var run=function(){var card=document.getElementById('s'+id);if(card){card.style.opacity=.6;card.querySelectorAll('button').forEach(function(b){b.disabled=true})}toast(esc(t('wait')));
  api('act',{sig:id,action:a,arg:arg,args:args}).then(function(r){if(r.pending){toast(esc(t('slow')))}else{toast(esc(noEmoji(String(r.msg||'OK').replace(/<[^>]+>/g,''))));haptic(r.ok?'success':'error')}load()}).catch(function(){toast('Error');load()})};
 if(m&&!skip)confirmBox(m,run);else run()}
function load(){var w=cur();if(!w){render();return}if(w.type=='cex'){if(w.ex=='dipfunded'){if(S.dfx)dfOneLoad();else dfxLoad()}else cxRefresh();render();return}
 return api('open',{ws:w.id}).then(function(d){if(!S.items.length&&d.items.length)S.anim=true;S.items=d.items;w.open=d.items.length;render();loadSpark();if(S.page&&S.page.id=='term'&&!S.page.drag&&!S.page.pend){termRender();termLoad()}}).catch(function(){render()})}

/* ---- yulduzli fon ---- */
(function(){var c=document.getElementById('bg'),x=c.getContext('2d'),W,H,st=[],dpr=Math.min(2,window.devicePixelRatio||1);
 function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  st=[];var n=Math.round(W*H/1500);for(var k=0;k<n;k++)st.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()<.08?Math.random()*.8+.9:Math.random()*.7+.25,
   a:Math.random()*.6+.35,s:Math.random()*2+.5,ph:Math.random()*6.3,v:Math.random()*.06+.01,g:Math.random()<.12})}
size();
 /* 257: bir marta chiziladi — doimiy 60 kadr/s sikl telefonni qizdirardi */
 function draw(){x.clearRect(0,0,W,H);for(var k=0;k<st.length;k++){var s=st[k];
   x.globalAlpha=s.a;x.fillStyle=s.g?'#9df2cf':'#ffffff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill()}
  x.globalAlpha=1}
 draw();addEventListener('resize',function(){size();draw()})})();

 g.appendChild(w);g.classList.add('tap');setTimeout(function(){w.remove();g.classList.remove('tap')},620)},{passive:true});

 if(/^g\d+$/.test(sp)&&!q0.get('g'))q0.set('g',sp.slice(1));if(/^sg_\d+$/.test(sp))setTimeout(function(){sgOpen(+sp.slice(3))},700);if(TABS.indexOf(sp)>=0&&!q0.get('tab'))q0.set('tab',sp);
 if(!tg||!tg.initData){S.pub=true;S.bot=BOT;var nl=q0.get('lang');S.lang=T[nl]?nl:'uz';try{var sl0=localStorage.getItem('tc_lang');if(sl0&&T[sl0])S.lang=sl0}catch(e){}
  document.getElementById('tBot').textContent=t('bot');document.getElementById('botIc').innerHTML=ic('bot',16);

  S.tab=TABS.indexOf(q0.get('tab'))>=0?q0.get('tab'):'top';render();if(q0.get('g'))setTimeout(function(){openGroup(+q0.get('g'))},50);return}
 if(/^nws_\d+$/.test(sp))newsShare(+sp.slice(4));
